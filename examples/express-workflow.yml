name: Deploy Express/Node.js Project

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Package Express API
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies & Build
        run: |
          npm ci
          npm run build 2>/dev/null || true

      - name: 📦 Generate Prisma Engine & Install Production Dependencies
        run: |
          # If project uses Prisma, generate client for host OS
          if [[ -f "prisma/schema.prisma" ]]; then
            npx prisma generate
          fi
          # Prune dev dependencies to minimize bundle size
          npm prune --omit=dev

      - name: 📦 Package Artifact
        run: |
          tar -czf /tmp/release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='*.ts' \
            .

      - name: 🚀 Deploy via DevOps Automation Engine
        uses: Byte-Bandits-India/devOpsAutomation/.github/workflows/deploy.yml@main
        with:
          project_name: "dashboard-prod-backend" # Replace with your registered projects.yml name
          environment: "production"
          artifact_path: "/tmp/release.tar.gz"
        secrets:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
