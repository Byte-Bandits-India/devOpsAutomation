version: "1.0"

server:
  base_dir: "/var/www"
  nginx_conf_dir: "/etc/nginx/conf.d"
  log_dir: "/var/log/deployments"
  lock_dir: "/var/lock/deployments"
  backup_dir: "/var/backups"
  keep_releases: 3
  disk_limits:
    warn_free_mb: 1000
    block_free_mb: 250
    emergency_free_mb: 100

projects:
  # ============================================================================
  # TITAN - DECOMMISSIONED / REMOVED
  # ============================================================================

