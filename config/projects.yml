  # ============================================================================
  # BYTEBANDITS (Next.js 15 Standalone Website)
  # ============================================================================
  bytebandits:
    repository: "Byte-Bandits-India/ByteBandits"
    type: "nextjs-standalone"
    environment: "production"
    allowed_branches:
      - "main"
    domain: "thebytebandits.com"
    aliases:
      - "www.thebytebandits.com"
    bind_ip: "127.0.0.1"
    port: 3003
    health_check:
      path: "/"
      expected_status: 200
      timeout_seconds: 5
      max_retries: 5
      retry_delay_seconds: 3
    runtime:
      entrypoint: "server.js"
      manager: "pm2"
    resources:
      memory_max_restart: "250M"
    persistent:
      directories: []

  # ============================================================================
  # DASHBOARD / CRM - PRODUCTION (Backend API on EC2 | Frontend on Vercel)
  # Frontend: Vercel (https://crm.xylozentech.com)
  # ============================================================================
  dashboard-prod-backend:
    repository: "Byte-Bandits-India/Xylozen-crm"
    type: "node"
    environment: "production"
    allowed_branches:
      - "main"
    domain: "api-crm.xylozentech.com"
    path_prefix: "/api"
    bind_ip: "127.0.0.1"
    port: 4001
    health_check:
      path: "/api/auth/me"
      expected_status: 401
      timeout_seconds: 5
      max_retries: 5
      retry_delay_seconds: 3
    runtime:
      entrypoint: "dist/server.js"
      manager: "pm2"
    resources:
      memory_max_restart: "300M"
    persistent:
      directories:
        - "uploads"
    database:
      type: "mysql"
      migrations: "manual"

  # dashboard-prod-frontend migrated to Vercel

  # ============================================================================
  # DASHBOARD / CRM - TEST - DECOMMISSIONED / REMOVED
  # ============================================================================

  # ============================================================================
  # PHPMYADMIN (Native PHP-FPM web UI for MySQL management)
  # ============================================================================
  phpmyadmin:
    repository: null
    type: "php-fpm"
    environment: "production"
    domain: "crm.xylozentech.com"
    path_prefix: "/phpmyadmin"
    root_path: "/var/www/phpmyadmin"
    resources:
      memory_max_restart: null

  # ============================================================================
  # VIDEO SCROLL ANIMATION (Vite React Static SPA)
  # Migrated to Vercel: https://scroll.xylozentech.com
  # ============================================================================
  # video-scroll-animation:
  #   repository: "Byte-Bandits-India/Video-scroll-animation"
  #   type: "static-spa"
  #   environment: "production"
  #   allowed_branches:
  #     - "main"
  #   domain: "scroll.xylozentech.com"
  #   static_root_subdir: "dist"
  #   resources:
  #     memory_max_restart: null

  # ============================================================================
  # RIMOTO (Hybrid: Static SPA Frontend + Node/Express API)
  # ============================================================================
  rimoto-backend:
    repository: "Byte-Bandits-India/Rimoto-backend"
    type: "node"
    environment: "production"
    allowed_branches:
      - "main"
    domain: "rimoto.xylozentech.com"
    path_prefix: "/api"
    bind_ip: "127.0.0.1"
    port: 4003
    health_check:
      path: "/api/v1/health"
      expected_status: 200
      timeout_seconds: 5
      max_retries: 5
      retry_delay_seconds: 3
    runtime:
      entrypoint: "dist/index.js"
      manager: "pm2"
    resources:
      memory_max_restart: "250M"
    persistent:
      directories:
        - "uploads"
    database:
      type: "mysql"
      migrations: "prisma"

  rimoto-frontend:
    repository: "Byte-Bandits-India/Rimoto-frontend"
    type: "static-spa"
    environment: "production"
    allowed_branches:
      - "main"
    domain: "rimoto.xylozentech.com"
    static_root_subdir: "dist"
    resources:
      memory_max_restart: null

